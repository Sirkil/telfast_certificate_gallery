<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telfast GAC - Live Showcase Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Only the background image is visible, no dark overlays or tints */
      background-color: #0f0518;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    /* Centered display stage */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Certificate Slide Container: Horizontal Carousel Slide */
    .cert-slide {
      position: absolute;
      inset: 0;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      visibility: hidden;
      transform: translate3d(100vw, 0, 0) scale(0.8);
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.75s ease,
                  filter 0.75s ease;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Active visible slide: Centered, fully opaque, sharp focus */
    .cert-slide.active {
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0) scale(1);
      filter: brightness(1);
      z-index: 10;
      pointer-events: auto;
    }

    /* Previous peek slide: Visible on the left edge */
    .cert-slide.prev-peek {
      opacity: 0.45;
      visibility: visible;
      transform: translate3d(-53vw, 0, 0) scale(0.86);
      filter: brightness(0.72);
      z-index: 5;
      pointer-events: auto;
      cursor: pointer;
    }
    .cert-slide.prev-peek:hover {
      opacity: 0.68;
      filter: brightness(0.85);
    }

    /* Next peek slide: Visible on the right edge */
    .cert-slide.next-peek {
      opacity: 0.45;
      visibility: visible;
      transform: translate3d(53vw, 0, 0) scale(0.86);
      filter: brightness(0.72);
      z-index: 5;
      pointer-events: auto;
      cursor: pointer;
    }
    .cert-slide.next-peek:hover {
      opacity: 0.68;
      filter: brightness(0.85);
    }

    /* Offscreen to the left (exited) */
    .cert-slide.offscreen-left {
      opacity: 0;
      visibility: hidden;
      transform: translate3d(-96vw, 0, 0) scale(0.78);
      filter: brightness(0.6);
      z-index: 2;
      pointer-events: none;
    }

    /* Offscreen to the right (queued) */
    .cert-slide.offscreen-right {
      opacity: 0;
      visibility: hidden;
      transform: translate3d(96vw, 0, 0) scale(0.78);
      filter: brightness(0.6);
      z-index: 2;
      pointer-events: none;
    }

    /* Fade-in for 1st submission (and stays still in center) */
    .cert-slide.fade-in-still {
      transform: translate3d(0, 0, 0) scale(1) !important;
      opacity: 1 !important;
      visibility: visible !important;
      filter: brightness(1) !important;
      animation: fadeInStill 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInStill {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Horizontal slide-in for brand-new submission arrival */
    .cert-slide.new-arrival-in {
      animation: newArrivalSlide 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      visibility: visible;
      z-index: 15;
    }

    @keyframes newArrivalSlide {
      0% {
        opacity: 0;
        transform: translate3d(85vw, 0, 0) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Certificate Image */
    .cert-image {
      max-width: 58vw;
      max-height: 65vh;
      width: auto;
      height: auto;
      object-fit: contain;
      aspect-ratio: 1500 / 1167;
      border-radius: 14px;
      box-shadow: 
        0 25px 70px rgba(0, 0, 0, 0.8),
        0 0 45px rgba(103, 53, 132, 0.38);
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.35s ease, box-shadow 0.35s ease, filter 0.35s ease;
    }

    .cert-slide.active .cert-image {
      box-shadow: 
        0 30px 85px rgba(0, 0, 0, 0.88),
        0 0 55px rgba(103, 53, 132, 0.48);
    }
  </style>
</head>
<body>
  <!-- Pure Centered Showcase Stage: ONLY Background & Certificate Image -->
  <div class="stage" id="stage"></div>

  <!-- Fallback static data if opened offline / file protocol -->
  <script src="gallery_data.js"></script>

  <script>
    /**
     * =========================================================================
     * TELFAST GAC - AUTOMATIC CERTIFICATE CAROUSEL (ZERO-UI CINEMATIC STAGE)
     * =========================================================================
     * - Only background.jpg is shown
     * - Certificate image is centered in screen
     * - 1st submission: Fades in and stays still
     * - 2+ submissions: New submission fades in, then automatic carousel loops
     * - Browser Cache API + memory preloading for 0ms transitions
     * =========================================================================
     */

    // Google Sheets Logger Script URLs (checks primary and fallback)
    const SHEET_URLS = [
      'https://script.google.com/macros/s/AKfycbzgIVp72CexxQYMDm2dFqzOEJ2TAiIbU6aKiLCnRhfghFDYqRZxRMGkVcMgghOO-sAT/exec',
      'https://script.google.com/macros/s/AKfycbyJ2Bbgju4GSU0-nszESg-wAFClNN1N0YfCsYJDZYBDsqLVorms9f1Q4KSL4otXwpc/exec'
    ];

    const LOCAL_SSE_URL = 'http://localhost:8765/events';
    const CACHE_NAME = 'telfast-cert-cache-v2';
    const CAROUSEL_INTERVAL_MS = 5000;    // 5 seconds per certificate slide
    const NEW_SUBMISSION_PAUSE_MS = 6500; // 6.5s display time for new arrivals

    let certificates = [];
    let displayList = [];
    let currentIndex = 0;
    let carouselTimer = null;
    let pollTimer = null;
    let isSingleCertMode = false;
    const blobUrlMap = new Map(); // In-memory cached Object URLs

    const stage = document.getElementById('stage');

    /**
     * Convert Google Drive view URL to high-resolution direct image link
     * Uses Google's fast CDN (lh3.googleusercontent.com/d/ID=w1600)
     */
    function extractDirectDriveImageUrl(url) {
      if (!url) return '';
      if (url.startsWith('data:') || url.startsWith('blob:')) return url;
      if (url.includes('lh3.googleusercontent.com') || url.includes('thumbnail?id=')) return url;

      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}=w1600`;
      }
      return url;
    }

    /**
     * Browser Cache API & Memory Preloader:
     * Caches image Blobs permanently in browser storage for instant 0ms switching
     */
    async function getCachedImageUrl(rawUrl) {
      const directUrl = extractDirectDriveImageUrl(rawUrl);
      if (!directUrl) return '';

      // 1. In-memory cache check
      if (blobUrlMap.has(directUrl)) {
        return blobUrlMap.get(directUrl);
      }

      // 2. Cache API check
      if ('caches' in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          const cached = await cache.match(directUrl);
          if (cached) {
            const blob = await cached.blob();
            const blobUrl = URL.createObjectURL(blob);
            blobUrlMap.set(directUrl, blobUrl);
            return blobUrl;
          }

          // Fetch & store in Cache
          const resp = await fetch(directUrl, { mode: 'cors' }).catch(() => null);
          if (resp && resp.ok) {
            await cache.put(directUrl, resp.clone());
            const blob = await resp.blob();
            const blobUrl = URL.createObjectURL(blob);
            blobUrlMap.set(directUrl, blobUrl);
            return blobUrl;
          }
        } catch (err) {
          // Silent fallback to directUrl
        }
      }

      return directUrl;
    }

    /**
     * Preload next image into browser GPU cache
     */
    function preloadImage(url) {
      if (!url) return;
      const img = new Image();
      img.src = url;
    }

    /**
     * Render slides into stage with peek view
     */
    async function renderSlides(isNewArrival = false) {
      if (!certificates || certificates.length === 0) {
        stage.innerHTML = '';
        displayList = [];
        return;
      }

      stage.innerHTML = '';
      isSingleCertMode = certificates.length === 1;

      // Build displayList: replicate small lists so we have at least 4 slides for smooth peeking
      if (certificates.length === 1) {
        displayList = [...certificates];
      } else if (certificates.length === 2) {
        displayList = [...certificates, ...certificates, ...certificates]; // 6 items
      } else if (certificates.length === 3) {
        displayList = [...certificates, ...certificates]; // 6 items
      } else {
        displayList = [...certificates];
      }

      for (let i = 0; i < displayList.length; i++) {
        const item = displayList[i];
        const slide = document.createElement('div');
        slide.className = 'cert-slide';
        slide.id = `slide-${i}`;

        // Clicking peek slides navigates to them
        slide.addEventListener('click', (e) => {
          if (slide.classList.contains('prev-peek')) {
            e.stopPropagation();
            prevSlide();
          } else if (slide.classList.contains('next-peek')) {
            e.stopPropagation();
            nextSlide();
          }
        });

        const img = document.createElement('img');
        img.className = 'cert-image';
        img.alt = item.name ? `Certificate for ${item.name}` : 'Certificate';

        // Load image from Cache API or direct URL
        const resolvedUrl = await getCachedImageUrl(item.driveUrl || item.localImagePath);
        img.src = resolvedUrl || 'background.jpg';

        // Robust CDN fallback if primary URL encounters issues
        img.onerror = () => {
          const match = (item.driveUrl || '').match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || (item.driveUrl || '').match(/id=([a-zA-Z0-9_-]+)/);
          if (match && match[1] && !img.dataset.triedFallback) {
            img.dataset.triedFallback = '1';
            img.src = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1600`;
          } else if (item.qrCodeUrl) {
            img.src = item.qrCodeUrl;
          }
        };

        slide.appendChild(img);
        stage.appendChild(slide);

        // Preload upcoming images
        preloadImage(resolvedUrl);
      }

      // Case 1: First submission (1 certificate total) -> Fade in and remain still in center
      if (isSingleCertMode) {
        const firstSlide = document.getElementById('slide-0');
        if (firstSlide) {
          firstSlide.className = 'cert-slide active fade-in-still';
        }
        stopCarousel();
        return;
      }

      // Initialize classes for active, prev-peek, next-peek, and offscreen
      applySlideClasses(currentIndex);

      // Case 2: New arrival in multi-certificate set
      if (isNewArrival) {
        const arrivalSlide = document.getElementById(`slide-${currentIndex}`);
        if (arrivalSlide) {
          arrivalSlide.classList.add('new-arrival-in');
        }
      }

      // Case 3: 2 or more certificates -> Start automatic endless carousel
      startCarousel();
    }

    /**
     * Apply active, prev-peek, next-peek, and offscreen classes
     */
    function applySlideClasses(idx) {
      if (displayList.length <= 1) return;
      const total = displayList.length;
      const prevIdx = (idx - 1 + total) % total;
      const nextIdx = (idx + 1) % total;
      const prevPrevIdx = (idx - 2 + total) % total;

      for (let i = 0; i < total; i++) {
        const s = document.getElementById(`slide-${i}`);
        if (!s) continue;
        if (i === idx) {
          s.className = 'cert-slide active';
        } else if (i === prevIdx) {
          s.className = 'cert-slide prev-peek';
        } else if (i === nextIdx) {
          s.className = 'cert-slide next-peek';
        } else if (i === prevPrevIdx) {
          s.className = 'cert-slide offscreen-left';
        } else {
          s.className = 'cert-slide offscreen-right';
        }
      }
    }

    let isTransitioning = false;

    /**
     * Smoothly slide horizontally to targetIdx with visible next and previous peeks
     * direction: 'forward' (right-to-left) or 'backward' (left-to-right)
     */
    function goToSlide(targetIdx, direction = 'forward') {
      if (displayList.length <= 1) return;
      if (targetIdx === currentIndex) return;
      if (isTransitioning) return;
      isTransitioning = true;

      const total = displayList.length;

      if (direction === 'forward') {
        // Incoming peek slide on the right: ensure it starts offscreen right
        const incomingPeekIdx = (targetIdx + 1) % total;
        const incomingSlide = document.getElementById(`slide-${incomingPeekIdx}`);
        if (incomingSlide) {
          incomingSlide.style.transition = 'none';
          incomingSlide.className = 'cert-slide offscreen-right';
          void incomingSlide.offsetWidth; // Force layout reflow
          incomingSlide.style.transition = '';
        }
      } else {
        // Incoming peek slide on the left: ensure it starts offscreen left
        const incomingPeekIdx = (targetIdx - 1 + total) % total;
        const incomingSlide = document.getElementById(`slide-${incomingPeekIdx}`);
        if (incomingSlide) {
          incomingSlide.style.transition = 'none';
          incomingSlide.className = 'cert-slide offscreen-left';
          void incomingSlide.offsetWidth; // Force layout reflow
          incomingSlide.style.transition = '';
        }
      }

      currentIndex = targetIdx;
      applySlideClasses(currentIndex);

      setTimeout(() => {
        isTransitioning = false;
      }, 750);

      // Preload next certificates ahead of time
      const nextNextIdx = (currentIndex + 2) % total;
      if (displayList[nextNextIdx]) {
        getCachedImageUrl(displayList[nextNextIdx].driveUrl || displayList[nextNextIdx].localImagePath);
      }
    }

    /**
     * Advance to the next certificate in the carousel
     */
    function nextSlide() {
      if (displayList.length <= 1) return;
      const nextIdx = (currentIndex + 1) % displayList.length;
      goToSlide(nextIdx, 'forward');
      resetCarouselTimer();
    }

    /**
     * Advance to the previous certificate in the carousel
     */
    function prevSlide() {
      if (displayList.length <= 1) return;
      const prevIdx = (currentIndex - 1 + displayList.length) % displayList.length;
      goToSlide(prevIdx, 'backward');
      resetCarouselTimer();
    }

    /**
     * Start the automatic endless carousel
     */
    function startCarousel() {
      if (isSingleCertMode || certificates.length <= 1) return;
      stopCarousel();
      carouselTimer = setInterval(nextSlide, CAROUSEL_INTERVAL_MS);
    }

    /**
     * Stop carousel
     */
    function stopCarousel() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
    }

    /**
     * Reset carousel timer on manual interaction
     */
    function resetCarouselTimer() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = setInterval(nextSlide, CAROUSEL_INTERVAL_MS);
      }
    }

    /**
     * Merge incoming certificates from cloud or SSE
     */
    function mergeIncomingCertificates(incomingList) {
      if (!incomingList || !Array.isArray(incomingList) || incomingList.length === 0) return;

      let hasNewArrival = false;

      for (const item of incomingList) {
        if (!item.name || (!item.driveUrl && !item.localImagePath)) continue;

        const exists = certificates.some(c => 
          (c.driveUrl && item.driveUrl && c.driveUrl === item.driveUrl) ||
          (c.id && item.id && c.id === item.id) ||
          (c.name === item.name && c.timestamp === item.timestamp)
        );

        if (!exists) {
          certificates.unshift(item);
          hasNewArrival = true;
          getCachedImageUrl(item.driveUrl || item.localImagePath);
        }
      }

      if (hasNewArrival) {
        try {
          localStorage.setItem('telfast_certs_cache', JSON.stringify(certificates));
        } catch (_) {}

        currentIndex = 0; // Highlight the latest certificate
        renderSlides(true);

        // Pause on new submission so audience sees it, then resume automatic carousel
        stopCarousel();
        setTimeout(() => {
          if (certificates.length > 1) {
            startCarousel();
          }
        }, NEW_SUBMISSION_PAUSE_MS);
      }
    }

    /**
     * Poll Google Sheets for cloud submissions
     */
    async function pollCloudSubmissions() {
      for (const url of SHEET_URLS) {
        try {
          const resp = await fetch(url).catch(() => null);
          if (resp && resp.ok) {
            const data = await resp.json();
            if (data && data.status === 'success' && Array.isArray(data.certificates)) {
              mergeIncomingCertificates(data.certificates);
              break;
            }
          }
        } catch (_) {}
      }
    }

    /**
     * Connect to local SSE event stream from Flutter app (instant 0ms updates)
     */
    function connectLocalSSE() {
      try {
        const es = new EventSource(LOCAL_SSE_URL);
        es.addEventListener('new_certificate', (e) => {
          try {
            const sub = JSON.parse(e.data);
            if (sub && sub.name) {
              mergeIncomingCertificates([sub]);
            }
          } catch (_) {}
        });
        es.onerror = () => {
          es.close();
          setTimeout(connectLocalSSE, 10000);
        };
      } catch (_) {}
    }

    /**
     * Initialization on load
     */
    async function init() {
      // 1. Check window.CERTIFICATES from gallery_data.js
      if (window.CERTIFICATES && Array.isArray(window.CERTIFICATES) && window.CERTIFICATES.length > 0) {
        certificates = [...window.CERTIFICATES];
      }

      // 2. Check localStorage cache
      try {
        const cached = localStorage.getItem('telfast_certs_cache');
        if (cached && certificates.length === 0) {
          certificates = JSON.parse(cached);
        }
      } catch (_) {}

      // Initial render: if certificates exist, render them; otherwise stage stays clean
      if (certificates.length > 0) {
        renderSlides(false);
      }

      // 3. Connect to local SSE for instant local notification
      connectLocalSSE();

      // 4. Poll Google Sheets cloud submissions
      await pollCloudSubmissions();

      // 5. Poll cloud every 5 seconds for new submissions
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollCloudSubmissions, 5000);
    }

    // Toggle fullscreen on double-click or F / F11 key
    window.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F' || e.key === 'F11') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        }
      } else if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    // Touch & Swipe Support (for touch displays / tablets / kiosks)
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }
    }, { passive: true });

    // Mouse Drag Support (horizontal swipe with mouse)
    let isMouseDown = false;
    let mouseStartX = 0;
    let mouseStartY = 0;

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      const deltaX = e.clientX - mouseStartX;
      const deltaY = e.clientY - mouseStartY;
      if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    });

    // Run on startup
    init();
  </script>
</body>
</html>
