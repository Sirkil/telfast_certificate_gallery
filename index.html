<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telfast GAC - Live Showcase Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Only the background image is visible, no dark overlays or tints */
      background-color: #0f0518;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    /* Centered display stage - occupies top 80% of screen */
    .stage {
      position: relative;
      width: 100vw;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Certificate Slide Container: Horizontal Carousel Slide */
    .cert-slide {
      position: absolute;
      inset: 0;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transform: translate3d(100vw, 0, 0) scale(0.8);
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.75s ease,
                  filter 0.75s ease;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Active visible slide: Centered, fully opaque, sharp focus */
    .cert-slide.active {
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0) scale(1);
      filter: brightness(1);
      z-index: 10;
      pointer-events: auto;
    }

    /* Previous peek slide: Visible on the left edge */
    .cert-slide.prev-peek {
      opacity: 0.45;
      visibility: visible;
      transform: translate3d(-50vw, 0, 0) scale(0.86);
      filter: brightness(0.72);
      z-index: 5;
      pointer-events: auto;
      cursor: pointer;
    }
    .cert-slide.prev-peek:hover {
      opacity: 0.68;
      filter: brightness(0.85);
    }

    /* Next peek slide: Visible on the right edge */
    .cert-slide.next-peek {
      opacity: 0.45;
      visibility: visible;
      transform: translate3d(50vw, 0, 0) scale(0.86);
      filter: brightness(0.72);
      z-index: 5;
      pointer-events: auto;
      cursor: pointer;
    }
    .cert-slide.next-peek:hover {
      opacity: 0.68;
      filter: brightness(0.85);
    }

    /* Offscreen to the left (exited) */
    .cert-slide.offscreen-left {
      opacity: 0;
      visibility: hidden;
      transform: translate3d(-96vw, 0, 0) scale(0.78);
      filter: brightness(0.6);
      z-index: 2;
      pointer-events: none;
    }

    /* Offscreen to the right (queued) */
    .cert-slide.offscreen-right {
      opacity: 0;
      visibility: hidden;
      transform: translate3d(96vw, 0, 0) scale(0.78);
      filter: brightness(0.6);
      z-index: 2;
      pointer-events: none;
    }

    /* Fade-in for 1st submission (and stays still in center) */
    .cert-slide.fade-in-still {
      transform: translate3d(0, 0, 0) scale(1) !important;
      opacity: 1 !important;
      visibility: visible !important;
      filter: brightness(1) !important;
      animation: fadeInStill 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInStill {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Horizontal slide-in for brand-new submission arrival */
    .cert-slide.new-arrival-in {
      animation: newArrivalSlide 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      visibility: visible;
      z-index: 15;
    }

    @keyframes newArrivalSlide {
      0% {
        opacity: 0;
        transform: translate3d(85vw, 0, 0) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Certificate Image - reduced in size by 20% (was 58vw x 65vh) */
    .cert-image {
      max-width: 46.4vw;
      max-height: 52vh;
      width: auto;
      height: auto;
      object-fit: contain;
      aspect-ratio: 1500 / 1167;
      border-radius: 14px;
      box-shadow: 
        0 22px 60px rgba(0, 0, 0, 0.82),
        0 0 40px rgba(103, 53, 132, 0.38);
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.35s ease, box-shadow 0.35s ease, filter 0.35s ease;
    }

    .cert-slide.active .cert-image {
      box-shadow: 
        0 28px 75px rgba(0, 0, 0, 0.88),
        0 0 50px rgba(103, 53, 132, 0.48);
    }

    /* Telfast Logo in Top-Right Corner */
    .telfast-logo {
      position: fixed;
      top: 24px;
      right: 32px;
      height: clamp(38px, 5.5vh, 60px);
      width: auto;
      object-fit: contain;
      z-index: 100;
      pointer-events: none;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.6));
    }

    /* Bottom 20% Certificate Slideshow Strip (Flowing Right to Left) */
    .bottom-slideshow {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 20vh;
      z-index: 40;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(15, 5, 24, 0.3) 0%, rgba(15, 5, 24, 0.84) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(103, 53, 132, 0.35);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
      /* Elegant soft fade at screen edges */
      mask-image: linear-gradient(to right, transparent 0%, black 3.5%, black 96.5%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 3.5%, black 96.5%, transparent 100%);
    }

    .ticker-wrapper {
      display: flex;
      width: max-content;
      will-change: transform;
      animation: tickerScroll linear infinite;
    }

    .ticker-wrapper:hover {
      animation-play-state: paused;
    }

    @keyframes tickerScroll {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    .ticker-track {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .ticker-item {
      flex: 0 0 auto;
      height: calc(20vh - 26px);
      max-height: 140px;
      min-height: 60px;
      aspect-ratio: 1500 / 1167;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1.5px solid rgba(103, 53, 132, 0.45);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      background-color: rgba(22, 10, 32, 0.7);
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.4, 1),
                  border-color 0.28s ease,
                  box-shadow 0.28s ease;
    }

    .ticker-item:hover {
      transform: translateY(-4px) scale(1.06);
      border-color: #a450e4;
      box-shadow: 0 8px 24px rgba(164, 80, 228, 0.45);
      z-index: 10;
    }

    .ticker-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transition: filter 0.25s ease;
    }

    .ticker-item:hover img {
      filter: brightness(1.08);
    }

    /* View Switch Button in Top-Left Corner */
    .view-switch-btn {
      position: fixed;
      top: 24px;
      left: 32px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      background: rgba(18, 7, 28, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(103, 53, 132, 0.45);
      border-radius: 9999px;
      padding: 4px;
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 0 15px rgba(103, 53, 132, 0.2);
      transition: all 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .view-switch-btn:hover {
      border-color: rgba(168, 85, 247, 0.75);
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.6),
        0 0 22px rgba(168, 85, 247, 0.35);
      transform: translateY(-1px);
    }

    .view-switch-btn .switch-track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .view-switch-btn .switch-option {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.65);
      border-radius: 9999px;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .view-switch-btn .switch-option.active {
      color: #ffffff;
      background: linear-gradient(135deg, #673584 0%, #8c3cb5 100%);
      box-shadow: 
        0 2px 10px rgba(103, 53, 132, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .view-switch-btn:hover .switch-option:not(.active) {
      color: #ffffff;
    }

    .view-switch-btn .switch-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .view-switch-btn {
        top: 16px;
        left: 16px;
        padding: 3px;
      }
      .view-switch-btn .switch-option {
        padding: 5px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <!-- View Switch Button (Top-Left Corner: Gallery <-> Stand) -->
  <a href="stand.html" class="view-switch-btn" id="viewSwitchBtn" title="Switch to Stand View (or press 'S')">
    <div class="switch-track">
      <span class="switch-option active">
        <svg class="switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Gallery
      </span>
      <span class="switch-option">
        <svg class="switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        Stand
      </span>
    </div>
  </a>

  <!-- Telfast Brand Logo (Top-Right Corner) -->
  <img src="telfast_logo.png" alt="Telfast" class="telfast-logo" id="telfastLogo">

  <!-- Centered Showcase Stage: ONLY Background & Certificate Image (Top 80%) -->
  <div class="stage" id="stage"></div>

  <!-- Bottom 20% Certificate Slideshow Strip (Flowing Right to Left) -->
  <div class="bottom-slideshow" id="bottomSlideshow" style="display: none;">
    <div class="ticker-wrapper" id="tickerWrapper">
      <div class="ticker-track" id="tickerTrack1"></div>
      <div class="ticker-track" id="tickerTrack2" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Fallback static data if opened offline / file protocol -->
  <script src="gallery_data.js"></script>

  <script>
    /**
     * =========================================================================
     * TELFAST GAC - AUTOMATIC CERTIFICATE CAROUSEL (ZERO-UI CINEMATIC STAGE)
     * =========================================================================
     * - Only background.jpg is shown
     * - Certificate image is centered in screen
     * - 1st submission: Fades in and stays still
     * - 2+ submissions: New submission fades in, then automatic carousel loops
     * - Browser Cache API + memory preloading for 0ms transitions
     * =========================================================================
     */

    // Google Sheets Logger Script URLs (checks primary and fallback)
    const SHEET_URLS = [
      'https://script.google.com/macros/s/AKfycbzgIVp72CexxQYMDm2dFqzOEJ2TAiIbU6aKiLCnRhfghFDYqRZxRMGkVcMgghOO-sAT/exec',
      'https://script.google.com/macros/s/AKfycbyJ2Bbgju4GSU0-nszESg-wAFClNN1N0YfCsYJDZYBDsqLVorms9f1Q4KSL4otXwpc/exec'
    ];

    const LOCAL_SSE_URL = 'http://localhost:8765/events';
    const CACHE_NAME = 'telfast-cert-cache-v2';
    const CAROUSEL_INTERVAL_MS = 5000;    // 5 seconds per certificate slide
    const NEW_SUBMISSION_PAUSE_MS = 6500; // 6.5s display time for new arrivals

    let certificates = [];
    let displayList = [];
    let currentIndex = 0;
    let carouselTimer = null;
    let pollTimer = null;
    let isSingleCertMode = false;
    let isPreviewFallback = false;
    const blobUrlMap = new Map(); // In-memory cached Object URLs

    const stage = document.getElementById('stage');

    /**
     * Convert Google Drive view URL to high-resolution direct image link
     * Uses Google's fast CDN (lh3.googleusercontent.com/d/ID=w1600)
     */
    function extractDirectDriveImageUrl(url) {
      if (!url) return '';
      if (url.startsWith('data:') || url.startsWith('blob:')) return url;
      if (url.includes('lh3.googleusercontent.com') || url.includes('thumbnail?id=')) return url;

      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}=w1600`;
      }
      return url;
    }

    /**
     * Browser Cache API & Memory Preloader:
     * Caches image Blobs permanently in browser storage for instant 0ms switching
     */
    async function getCachedImageUrl(rawUrl) {
      const directUrl = extractDirectDriveImageUrl(rawUrl);
      if (!directUrl) return '';

      // 1. In-memory cache check
      if (blobUrlMap.has(directUrl)) {
        return blobUrlMap.get(directUrl);
      }

      // 2. Cache API check
      if ('caches' in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          const cached = await cache.match(directUrl);
          if (cached) {
            const blob = await cached.blob();
            const blobUrl = URL.createObjectURL(blob);
            blobUrlMap.set(directUrl, blobUrl);
            return blobUrl;
          }

          // Fetch & store in Cache
          const resp = await fetch(directUrl, { mode: 'cors' }).catch(() => null);
          if (resp && resp.ok) {
            await cache.put(directUrl, resp.clone());
            const blob = await resp.blob();
            const blobUrl = URL.createObjectURL(blob);
            blobUrlMap.set(directUrl, blobUrl);
            return blobUrl;
          }
        } catch (err) {
          // Silent fallback to directUrl
        }
      }

      return directUrl;
    }

    /**
     * Preload next image into browser GPU cache
     */
    function preloadImage(url) {
      if (!url) return;
      const img = new Image();
      img.src = url;
    }

    /**
     * Render slides into stage with peek view
     */
    async function renderSlides(isNewArrival = false) {
      if (!certificates || certificates.length === 0) {
        stage.innerHTML = '';
        displayList = [];
        return;
      }

      stage.innerHTML = '';
      isSingleCertMode = certificates.length === 1;

      // Build displayList: replicate small lists so we have at least 4 slides for smooth peeking
      if (certificates.length === 1) {
        displayList = [...certificates];
      } else if (certificates.length === 2) {
        displayList = [...certificates, ...certificates, ...certificates]; // 6 items
      } else if (certificates.length === 3) {
        displayList = [...certificates, ...certificates]; // 6 items
      } else {
        displayList = [...certificates];
      }

      for (let i = 0; i < displayList.length; i++) {
        const item = displayList[i];
        const slide = document.createElement('div');
        slide.className = 'cert-slide';
        slide.id = `slide-${i}`;

        // Clicking peek slides navigates to them
        slide.addEventListener('click', (e) => {
          if (slide.classList.contains('prev-peek')) {
            e.stopPropagation();
            prevSlide();
          } else if (slide.classList.contains('next-peek')) {
            e.stopPropagation();
            nextSlide();
          }
        });

        const img = document.createElement('img');
        img.className = 'cert-image';
        img.alt = item.name ? `Certificate for ${item.name}` : 'Certificate';

        // Load image from Cache API or direct URL
        const resolvedUrl = await getCachedImageUrl(item.driveUrl || item.localImagePath);
        img.src = resolvedUrl || 'background.jpg';

        // Robust CDN fallback if primary URL encounters issues
        img.onerror = () => {
          const match = (item.driveUrl || '').match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || (item.driveUrl || '').match(/id=([a-zA-Z0-9_-]+)/);
          if (match && match[1] && !img.dataset.triedFallback) {
            img.dataset.triedFallback = '1';
            img.src = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1600`;
          } else if (item.qrCodeUrl) {
            img.src = item.qrCodeUrl;
          }
        };

        slide.appendChild(img);
        stage.appendChild(slide);

        // Preload upcoming images
        preloadImage(resolvedUrl);
      }

      // Case 1: First submission (1 certificate total) -> Fade in and remain still in center
      if (isSingleCertMode) {
        const firstSlide = document.getElementById('slide-0');
        if (firstSlide) {
          firstSlide.className = 'cert-slide active fade-in-still';
        }
        stopCarousel();
        return;
      }

      // Initialize classes for active, prev-peek, next-peek, and offscreen
      applySlideClasses(currentIndex);

      // Case 2: New arrival in multi-certificate set
      if (isNewArrival) {
        const arrivalSlide = document.getElementById(`slide-${currentIndex}`);
        if (arrivalSlide) {
          arrivalSlide.classList.add('new-arrival-in');
        }
      }

      // Case 3: 2 or more certificates -> Start automatic endless carousel
      startCarousel();
    }

    /**
     * Apply active, prev-peek, next-peek, and offscreen classes
     */
    function applySlideClasses(idx) {
      if (displayList.length <= 1) return;
      const total = displayList.length;
      const prevIdx = (idx - 1 + total) % total;
      const nextIdx = (idx + 1) % total;
      const prevPrevIdx = (idx - 2 + total) % total;

      for (let i = 0; i < total; i++) {
        const s = document.getElementById(`slide-${i}`);
        if (!s) continue;
        if (i === idx) {
          s.className = 'cert-slide active';
        } else if (i === prevIdx) {
          s.className = 'cert-slide prev-peek';
        } else if (i === nextIdx) {
          s.className = 'cert-slide next-peek';
        } else if (i === prevPrevIdx) {
          s.className = 'cert-slide offscreen-left';
        } else {
          s.className = 'cert-slide offscreen-right';
        }
      }
    }

    let isTransitioning = false;

    /**
     * Smoothly slide horizontally to targetIdx with visible next and previous peeks
     * direction: 'forward' (right-to-left) or 'backward' (left-to-right)
     */
    function goToSlide(targetIdx, direction = 'forward') {
      if (displayList.length <= 1) return;
      if (targetIdx === currentIndex) return;
      if (isTransitioning) return;
      isTransitioning = true;

      const total = displayList.length;

      if (direction === 'forward') {
        // Incoming peek slide on the right: ensure it starts offscreen right
        const incomingPeekIdx = (targetIdx + 1) % total;
        const incomingSlide = document.getElementById(`slide-${incomingPeekIdx}`);
        if (incomingSlide) {
          incomingSlide.style.transition = 'none';
          incomingSlide.className = 'cert-slide offscreen-right';
          void incomingSlide.offsetWidth; // Force layout reflow
          incomingSlide.style.transition = '';
        }
      } else {
        // Incoming peek slide on the left: ensure it starts offscreen left
        const incomingPeekIdx = (targetIdx - 1 + total) % total;
        const incomingSlide = document.getElementById(`slide-${incomingPeekIdx}`);
        if (incomingSlide) {
          incomingSlide.style.transition = 'none';
          incomingSlide.className = 'cert-slide offscreen-left';
          void incomingSlide.offsetWidth; // Force layout reflow
          incomingSlide.style.transition = '';
        }
      }

      currentIndex = targetIdx;
      applySlideClasses(currentIndex);

      setTimeout(() => {
        isTransitioning = false;
      }, 750);

      // Preload next certificates ahead of time
      const nextNextIdx = (currentIndex + 2) % total;
      if (displayList[nextNextIdx]) {
        getCachedImageUrl(displayList[nextNextIdx].driveUrl || displayList[nextNextIdx].localImagePath);
      }
    }

    /**
     * Advance to the next certificate in the carousel
     */
    function nextSlide() {
      if (displayList.length <= 1) return;
      const nextIdx = (currentIndex + 1) % displayList.length;
      goToSlide(nextIdx, 'forward');
      resetCarouselTimer();
    }

    /**
     * Advance to the previous certificate in the carousel
     */
    function prevSlide() {
      if (displayList.length <= 1) return;
      const prevIdx = (currentIndex - 1 + displayList.length) % displayList.length;
      goToSlide(prevIdx, 'backward');
      resetCarouselTimer();
    }

    /**
     * Start the automatic endless carousel
     */
    function startCarousel() {
      if (isSingleCertMode || certificates.length <= 1) return;
      stopCarousel();
      carouselTimer = setInterval(nextSlide, CAROUSEL_INTERVAL_MS);
    }

    /**
     * Stop carousel
     */
    function stopCarousel() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
    }

    /**
     * Reset carousel timer on manual interaction
     */
    function resetCarouselTimer() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = setInterval(nextSlide, CAROUSEL_INTERVAL_MS);
      }
    }

    /**
     * Merge incoming certificates from cloud or SSE
     */
    function mergeIncomingCertificates(incomingList) {
      if (!incomingList || !Array.isArray(incomingList) || incomingList.length === 0) return;

      let hasNewArrival = false;

      for (const item of incomingList) {
        if (!item.name || (!item.driveUrl && !item.localImagePath)) continue;

        const exists = certificates.some(c => 
          (c.driveUrl && item.driveUrl && c.driveUrl === item.driveUrl) ||
          (c.id && item.id && c.id === item.id) ||
          (c.name === item.name && c.timestamp === item.timestamp)
        );

        if (!exists) {
          if (isPreviewFallback) {
            certificates = [];
            isPreviewFallback = false;
          }
          certificates.unshift(item);
          hasNewArrival = true;
          getCachedImageUrl(item.driveUrl || item.localImagePath);
        }
      }

      if (hasNewArrival) {
        try {
          localStorage.setItem('telfast_certs_cache', JSON.stringify(certificates));
        } catch (_) {}

        currentIndex = 0; // Highlight the latest certificate
        renderSlides(true);
        renderBottomSlideshow();

        // Pause on new submission so audience sees it, then resume automatic carousel
        stopCarousel();
        setTimeout(() => {
          if (certificates.length > 1) {
            startCarousel();
          }
        }, NEW_SUBMISSION_PAUSE_MS);
      }
    }

    /**
     * Render the bottom 20% continuous right-to-left slideshow
     */
    function renderBottomSlideshow() {
      const strip = document.getElementById('bottomSlideshow');
      const track1 = document.getElementById('tickerTrack1');
      const track2 = document.getElementById('tickerTrack2');
      const wrapper = document.getElementById('tickerWrapper');

      if (!certificates || certificates.length === 0) {
        if (strip) strip.style.display = 'none';
        return;
      }

      if (strip) strip.style.display = 'flex';

      // Determine items needed to fill at least 1.5x screen width so infinite scroll is seamless
      const thumbH = Math.max(60, window.innerHeight * 0.2 - 26);
      const thumbW = thumbH * (1500 / 1167);
      const itemFullW = thumbW + 16;
      const minItems = Math.max(8, Math.ceil((window.innerWidth * 1.5) / itemFullW));

      let repeated = [];
      while (repeated.length < minItems) {
        for (let i = 0; i < certificates.length; i++) {
          repeated.push({ cert: certificates[i], origIndex: i });
          if (repeated.length >= minItems && repeated.length % certificates.length === 0) break;
        }
      }

      track1.innerHTML = '';
      track2.innerHTML = '';

      for (const item of repeated) {
        const div = document.createElement('div');
        div.className = 'ticker-item';
        div.dataset.certIndex = item.origIndex;
        div.title = item.cert.name ? `Dr. ${item.cert.name}` : 'Certificate';

        const img = document.createElement('img');
        img.alt = item.cert.name ? `Certificate for ${item.cert.name}` : 'Certificate';

        // Set immediate thumbnail
        const direct = extractDirectDriveImageUrl(item.cert.driveUrl || item.cert.localImagePath);
        img.src = direct || item.cert.localImagePath || 'certificate.png';

        // Load cached blob URL if available
        getCachedImageUrl(item.cert.driveUrl || item.cert.localImagePath).then(url => {
          if (url && url !== img.src) img.src = url;
        });

        img.onerror = () => {
          const match = (item.cert.driveUrl || '').match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || (item.cert.driveUrl || '').match(/id=([a-zA-Z0-9_-]+)/);
          if (match && match[1] && !img.dataset.triedFallback) {
            img.dataset.triedFallback = '1';
            img.src = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
          } else {
            img.src = 'certificate.png';
          }
        };

        div.appendChild(img);
        track1.appendChild(div);
      }

      // Clone track1 items into track2 for seamless right-to-left infinite loop
      track2.innerHTML = track1.innerHTML;

      // Calculate smooth scrolling duration (~40 pixels per second)
      const trackWidth = repeated.length * itemFullW;
      const duration = Math.max(25, Math.round(trackWidth / 40));
      wrapper.style.animationDuration = `${duration}s`;
    }

    /**
     * Poll Google Sheets for cloud submissions
     */
    async function pollCloudSubmissions() {
      for (const url of SHEET_URLS) {
        try {
          const resp = await fetch(url).catch(() => null);
          if (resp && resp.ok) {
            const data = await resp.json();
            if (data && data.status === 'success' && Array.isArray(data.certificates)) {
              mergeIncomingCertificates(data.certificates);
              break;
            }
          }
        } catch (_) {}
      }
    }

    /**
     * Connect to local SSE event stream from Flutter app (instant 0ms updates)
     */
    function connectLocalSSE() {
      try {
        const es = new EventSource(LOCAL_SSE_URL);
        es.addEventListener('new_certificate', (e) => {
          try {
            const sub = JSON.parse(e.data);
            if (sub && sub.name) {
              mergeIncomingCertificates([sub]);
            }
          } catch (_) {}
        });
        es.onerror = () => {
          es.close();
          setTimeout(connectLocalSSE, 10000);
        };
      } catch (_) {}
    }

    /**
     * Initialization on load
     */
    async function init() {
      // 1. Check window.CERTIFICATES from gallery_data.js
      if (window.CERTIFICATES && Array.isArray(window.CERTIFICATES) && window.CERTIFICATES.length > 0) {
        certificates = [...window.CERTIFICATES];
      }

      // 2. Check localStorage cache
      try {
        const cached = localStorage.getItem('telfast_certs_cache');
        if (cached && certificates.length === 0) {
          certificates = JSON.parse(cached);
        }
      } catch (_) {}

      // Fallback preview certificate if completely empty so the screen is never blank
      if (certificates.length === 0) {
        certificates = [
          { name: 'Dr. Participant', localImagePath: 'certificate.png', driveUrl: '' }
        ];
        isPreviewFallback = true;
      }

      // Initial render of both center stage and bottom slideshow
      renderSlides(false);
      renderBottomSlideshow();

      // Setup click listener on bottom slideshow to jump to clicked certificate
      const tickerWrapper = document.getElementById('tickerWrapper');
      if (tickerWrapper) {
        tickerWrapper.addEventListener('click', (e) => {
          const item = e.target.closest('.ticker-item');
          if (item && item.dataset.certIndex !== undefined) {
            const certIdx = parseInt(item.dataset.certIndex, 10);
            if (certificates[certIdx] && displayList.length > 0) {
              const target = certificates[certIdx];
              const slideIdx = displayList.findIndex(c => c === target);
              if (slideIdx !== -1) {
                goToSlide(slideIdx, slideIdx >= currentIndex ? 'forward' : 'backward');
                resetCarouselTimer();
              }
            }
          }
        });
      }

      // Re-render bottom strip on resize
      let resizeStripTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeStripTimer);
        resizeStripTimer = setTimeout(renderBottomSlideshow, 200);
      });

      // 3. Connect to local SSE for instant local notification
      connectLocalSSE();

      // 4. Poll Google Sheets cloud submissions
      await pollCloudSubmissions();

      // 5. Poll cloud every 5 seconds for new submissions
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollCloudSubmissions, 5000);
    }

    // Toggle fullscreen on double-click or F / F11 key
    window.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F' || e.key === 'F11') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        }
      } else if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key === 's' || e.key === 'S') {
        window.location.href = 'stand.html';
      }
    });

    // Touch & Swipe Support (for touch displays / tablets / kiosks)
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }
    }, { passive: true });

    // Mouse Drag Support (horizontal swipe with mouse)
    let isMouseDown = false;
    let mouseStartX = 0;
    let mouseStartY = 0;

    window.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      mouseStartX = e.clientX;
      mouseStartY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      const deltaX = e.clientX - mouseStartX;
      const deltaY = e.clientY - mouseStartY;
      if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    });

    // Run on startup
    init();
  </script>
</body>
</html>
